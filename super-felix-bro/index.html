<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Super Félix Bro, un pequeño homenaje jugable con destino a Cimavilla."
    />
    <title>Super Félix Bro</title>
    <script type="module" crossorigin src="/super-felix-bro/assets/index-oTSEw39J.js"></script>
    <link rel="stylesheet" crossorigin href="/super-felix-bro/assets/index-DV2XFy1Z.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="game-header">
        <div>
          <p class="eyebrow">Un homenaje asturiano en 16 bits</p>
          <h1>Super Félix Bro</h1>
        </div>
        <div class="controls" aria-label="Controles del juego">
          <span data-move-help><kbd>A</kbd><kbd>D</kbd> moverse</span>
          <span data-jump-help>
            <kbd>W</kbd> / <kbd>↑</kbd> / <kbd>Espacio</kbd> saltar
          </span>
          <span data-action-help><kbd>X</kbd> acción</span>
          <span><kbd>M</kbd> sonido</span>
        </div>
      </header>
      <section class="game-frame" aria-label="Juego Super Félix Bro">
        <div id="game"></div>
        <button
          class="sound-toggle"
          type="button"
          data-sound-toggle
          aria-label="Activar sonido"
          aria-pressed="false"
        >
          <svg
            class="utility-icon utility-icon--sound-on"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M4 9h4l5-4v14l-5-4H4z"></path>
            <path d="M16 8c1.4 1.1 1.4 6.9 0 8"></path>
            <path d="M19 5c3.2 2.7 3.2 11.3 0 14"></path>
          </svg>
          <svg
            class="utility-icon utility-icon--sound-off"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M4 9h4l5-4v14l-5-4H4z"></path>
            <path d="m17 9 5 5m0-5-5 5"></path>
          </svg>
          <span data-sound-label>ACTIVAR SONIDO</span>
        </button>
        <button
          class="pause-toggle"
          type="button"
          data-pause-toggle
          aria-label="Pausar el juego"
          aria-expanded="false"
        >
          <svg class="utility-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="4" width="5" height="16" rx="1"></rect>
            <rect x="14" y="4" width="5" height="16" rx="1"></rect>
          </svg>
          <span>PAUSA</span>
        </button>
        <section
          class="pause-overlay"
          data-pause-overlay
          aria-label="Juego en pausa"
          hidden
        >
          <div class="pause-panel">
            <h2>PAUSA</h2>
            <button type="button" data-pause-continue>CONTINUAR</button>
            <button type="button" data-pause-restart>REINICIAR NIVEL</button>
          </div>
        </section>
        <section class="touch-controls" aria-label="Controles táctiles">
          <div class="touch-controls__directions">
            <button
              class="touch-button touch-button--direction touch-button--up"
              type="button"
              data-touch-control="up"
              aria-label="Mover hacia arriba"
            >
              ↑
            </button>
            <button
              class="touch-button touch-button--direction touch-button--left"
              type="button"
              data-touch-control="left"
              aria-label="Mover a la izquierda"
            >
              ←
            </button>
            <button
              class="touch-button touch-button--direction touch-button--down"
              type="button"
              data-touch-control="down"
              aria-label="Mover hacia abajo"
            >
              ↓
            </button>
            <button
              class="touch-button touch-button--direction touch-button--right"
              type="button"
              data-touch-control="right"
              aria-label="Mover a la derecha"
            >
              →
            </button>
          </div>
          <div class="touch-controls__actions">
            <button
              class="touch-button touch-button--throw"
              type="button"
              data-touch-control="throw"
              data-action-button
              aria-label="Acción"
            >
              SIDRAZO
            </button>
            <button
              class="touch-button touch-button--jump"
              type="button"
              data-touch-control="jump"
              aria-label="Saltar"
            >
              SALTAR
            </button>
          </div>
        </section>
      </section>
      <p class="tip">
        Consejo: pisa bichos y cangrejos; esquiva oricios y regalos de gaviota.
      </p>
    </main>
  </body>
</html>
