<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Super Félix Bro, un pequeño homenaje jugable con destino a Cimadevilla."
    />
    <title>Super Félix Bro</title>
    <script type="module" crossorigin src="/super-felix-bro/assets/index-vxu1LpUi.js"></script>
    <link rel="stylesheet" crossorigin href="/super-felix-bro/assets/index-DRpfdMur.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="game-header">
        <div>
          <p class="eyebrow">Un homenaje asturiano en 16 bits</p>
          <h1>Super Félix Bro</h1>
        </div>
        <div class="controls" aria-label="Controles del juego">
          <span><kbd>A</kbd><kbd>D</kbd> moverse</span>
          <span><kbd>W</kbd> / <kbd>↑</kbd> / <kbd>Espacio</kbd> saltar</span>
          <span><kbd>M</kbd> sonido</span>
        </div>
      </header>
      <section class="game-frame" aria-label="Juego Super Félix Bro">
        <div id="game"></div>
      </section>
      <section class="touch-controls" aria-label="Controles táctiles">
        <div class="touch-controls__directions">
          <button
            class="touch-button touch-button--direction"
            type="button"
            data-touch-control="left"
            aria-label="Mover a la izquierda"
          >
            ←
          </button>
          <button
            class="touch-button touch-button--direction"
            type="button"
            data-touch-control="right"
            aria-label="Mover a la derecha"
          >
            →
          </button>
        </div>
        <button
          class="touch-button touch-button--jump"
          type="button"
          data-touch-control="jump"
          aria-label="Saltar"
        >
          SALTAR
        </button>
      </section>
      <p class="tip">
        Consejo de Félix: a los bichos se les gana con un buen salto, no discutiendo.
      </p>
    </main>
  </body>
</html>
