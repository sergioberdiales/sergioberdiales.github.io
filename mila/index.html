  <main>
    <h1>Generador de chistes <span>de Mila<svg aria-hidden="true" viewBox="0 0 48 48"><ellipse cx="24" cy="31" rx="13" ry="10"/><ellipse cx="9" cy="20" rx="5" ry="7" transform="rotate(-25 9 20)"/><ellipse cx="19" cy="10" rx="5" ry="7"/><ellipse cx="31" cy="11" rx="5" ry="7"/><ellipse cx="40" cy="22" rx="5" ry="7" transform="rotate(25 40 22)"/></svg></span></h1>
